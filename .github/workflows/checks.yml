name: Checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest -q
